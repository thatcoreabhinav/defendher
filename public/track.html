<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Tracking</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style> body { margin: 0; } #map { height: 100vh; } </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    const map = L.map('map').setView([28.6, 77.2], 16);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let marker;
    const line = L.polyline([], { color: 'red' }).addTo(map);

    async function refresh() {
      const a = await (await fetch('/api/alerts/' + id)).json();
      const { lat, lng, at } = a.lastLocation;
      if (!marker) marker = L.marker([lat, lng]).addTo(map);
      marker.setLatLng([lat, lng]).bindPopup('Last seen: ' + new Date(at).toLocaleTimeString());
      line.setLatLngs(a.path.map(p => [p.lat, p.lng]));
      map.setView([lat, lng]);
    }

    refresh();
    setInterval(refresh, 4000);
  </script>
</body>
</html>
