<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEFENDher</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #1a1a2e; color: white; padding: 40px 20px; }
    #sos { width: 200px; height: 200px; border-radius: 50%; border: none; background: red; color: white;
           font-size: 40px; font-weight: bold; cursor: pointer; box-shadow: 0 0 30px red; }
    #sos:active { transform: scale(0.95); }
    #status { margin-top: 30px; font-size: 18px; }
    a { color: #4fc3f7; }
  </style>
</head>
<body>
  <h1>DEFENDher</h1>
  <p>Press SOS in an emergency</p>
  <p><a href="route.html">🗺️ Safe route guide</a></p>
  <button id="sos">SOS</button>
  <div id="status"></div>
  <div id="police" style="margin-top:15px; font-size:18px;"></div>

  <video id="preview" autoplay muted playsinline
    style="display:none; width:90%; max-width:400px; margin-top:20px; border:4px solid red; border-radius:10px;"></video>
  <p id="rec-label" style="display:none; color:red; font-weight:bold;">● RECORDING</p>
  <button id="stop" style="display:none; margin-top:10px; padding:10px 20px;">Stop recording</button>
  <div id="rec-actions" style="display:none; margin-top:15px;">
    <button id="send" style="padding:10px 20px; background:#2e7d32; color:white; border:none;">Send to authorities</button>
    <button id="erase" style="padding:10px 20px; background:#555; color:white; border:none;">Erase</button>
  </div>

  <hr style="margin:40px 0; border-color:#444;">
  <h2>Check Your Vehicle</h2>
  <input id="vnum" placeholder="e.g. DL1CAB1234" style="padding:10px; font-size:16px;">
  <button id="check" style="padding:10px 20px; font-size:16px;">Verify</button>
  <div id="vresult" style="margin-top:20px; font-size:18px;"></div>

  <script src="app.js"></script>
</body>
</html>
